server:
  port: 8052
spring:
  application:
    name: account-service
  datasource:
    url: ${ACCOUNT_SERVICE_DB_URI}
    username: ${DB_USER}
    password: ${db_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

customer:
  service:
    url: http://localhost:8051/customer/