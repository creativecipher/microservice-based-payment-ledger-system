server:
  # 8052 is default port if server_port not set
  port: ${SERVER_PORT:8052}
spring:
#  config:
#    import: optional:file:.env
  application:
    name: account-service
  datasource:
    url: ${ACCOUNT_SERVICE_DB_URI}
    #url: jdbc:mysql://localhost:3306/bank_account_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

# eureka set-up
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

