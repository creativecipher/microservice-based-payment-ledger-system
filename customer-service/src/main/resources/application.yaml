server:
  port: 8051

spring:
  application:
    name: customer-service
  datasource:
    url: ${CUSTOMER_SERVICE_DB_URI}
    username: ${DB_USER}
    password: ${db_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
